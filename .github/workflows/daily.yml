name: Daily Puzzle
on:
  schedule:
    - cron: '5 0 * * *'
    timezone: "America/Denver"
  workflow_dispatch:
    inputs:
      puzzle_id:
        description: 'Puzzle ID to backfill (leave empty for today)'
        required: false
      puzzle_date:
        description: 'Date for difficulty (YYYY-MM-DD, leave empty for today)'
        required: false
concurrency:
  group: gist-daily-generator
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Replenish rolling three-day puzzle buffer
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.puzzle_id }}" ] && ARGS="$ARGS --id=${{ github.event.inputs.puzzle_id }}"
          [ -n "${{ github.event.inputs.puzzle_date }}" ] && ARGS="$ARGS --date=${{ github.event.inputs.puzzle_date }}"
          if [ -n "$ARGS" ]; then
            node generate.mjs $ARGS
          else
            for attempt in 1 2 3 4; do
              node generate.mjs
            done
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit and push
        run: |
          git config user.name "gist-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gist.html puzzles.json
          git diff --staged --quiet || git commit -m "puzzle #$(date +'%Y-%m-%d')"
          git push
